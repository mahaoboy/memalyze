name: Feature request
description: Propose a feature (read the three constraints first)
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        memalyze is deliberately small. Before proposing, check the three constraints in
        [CONTRIBUTING.md](https://github.com/mahaoboy/memalyze/blob/main/CONTRIBUTING.md):
        four tools (ceiling five), one static offline binary, governance on every path.
  - type: textarea
    id: problem
    attributes:
      label: The problem, not the solution
      description: What can you not do today? Who is blocked by it?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: If there is none, say so — that is useful information.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - retrieval quality
        - redaction / governance
        - audit / export
        - deployment (docker, systemd)
        - harness integration
        - performance
        - other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit the constraints?
      options:
        - label: It does not require a new MCP tool (or I explain why an existing one cannot work)
        - label: It works offline with no new runtime service
        - label: It does not bypass redaction or audit
        - label: It is pure Go and CGO-free (if it adds a dependency)
      validations:
        required: true
