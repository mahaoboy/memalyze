name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test before tagging
        run: go test ./...
      - name: cross-compile
        run: make release

      # MCPB bundles for Claude Desktop / other MCPB clients. Built here, from the
      # tagged tree, so the version inside each bundle is the tag (build-mcpb.sh
      # refuses dirty builds and `git describe` strings).
      - name: install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: build MCPB bundles
        run: VERSION="$(sed 's/^v//' dist/VERSION)" ./scripts/build-mcpb.sh

      # 先自证：发布出去的 SHA256SUMS 必须能校验它自己的产物。
      # v0.1.0 就是漏了这一步，把 SHA256SUMS 自己按空文件哈希了出去。
      - name: verify checksums before publishing
        run: |
          ( cd dist && sha256sum -c SHA256SUMS )
          ( cd dist && sha256sum -c MCPB-SHA256SUMS )

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/memalyze-darwin-amd64
            dist/memalyze-darwin-arm64
            dist/memalyze-linux-amd64
            dist/memalyze-linux-arm64
            dist/memalyze-windows-amd64.exe
            dist/memalyze-*.mcpb
            dist/SHA256SUMS
            dist/MCPB-SHA256SUMS
          generate_release_notes: true
          # 不再留草稿：发布后立刻用 verify-release.sh 自证，
          # 需要人工改文案时用 `gh release edit` 补。
          draft: false

      # 用用户视角再验一遍：下载全部资产、逐个校验、跑 --version 与 demo。
      - name: verify published assets
        run: ./scripts/verify-release.sh "$GITHUB_REF_NAME"

      # registry metadata is NOT committed here: `mcpb pack` is not byte-reproducible,
      # so the hashes must be taken from the uploaded assets. After this workflow:
      #   python3 scripts/gen-server-json.py --from-release "$TAG"
      #   git commit deploy/registry/server.json && git push
      #   mcp-publisher publish
